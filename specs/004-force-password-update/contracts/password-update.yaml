# API Contracts: Force Password Update on First Login

## Overview
The password update functionality will be implemented using the existing profile update endpoint, with conditional logic to enforce password update on first login for non-admin users.

## Endpoints

### GET /profile
**Purpose**: Display user profile page
**Authentication**: Required (auth middleware)

**Response**:
- If user has `must_change_password` = true: Render profile edit view with password update form
- If user has `must_change_password` = false: Render normal profile view

**Request**:
- Method: `GET`
- URL: `/profile`
- Headers: `Authorization: Bearer {token}` (for API) or session cookie

**Response**:
- Status: `200 OK`
- Content-Type: `text/html`
- Body: Profile edit view with conditional password update form

---

### PUT /profile
**Purpose**: Update user profile information, including password update on first login
**Authentication**: Required (auth middleware)

**Request**:
- Method: `PUT`
- URL: `/profile`
- Content-Type: `application/x-www-form-urlencoded`
- Body: 
  ```
  _method=PUT
  name={user_name}
  email={user_email}
  current_password={current_password} (required only if must_change_password=true)
  new_password={new_password} (required only if must_change_password=true)
  new_password_confirmation={new_password_confirmation} (required only if must_change_password=true)
  ```

**Response**:
- Status: `302 Found` (redirect) or `200 OK`
- Location: `/profile` or appropriate success page
- Flash message: Success or error message

**Validation Rules**:
- If `must_change_password` is true:
  - `new_password` is required
  - `new_password` must be at least 8 characters
  - `new_password` must contain at least 1 special character (!@#$%^&*()_+-=[]{}|;:,.<>?)
  - `new_password` must contain at least 1 number
  - `new_password` must not be the same as the current password
  - `new_password_confirmation` must match `new_password`
- If `must_change_password` is false:
  - Password fields are optional
  - Other profile fields validated as per existing rules

---

## Middleware Contract

### MustChangePassword Middleware
**Purpose**: Redirect users to password update page if they have `must_change_password` = true
**Applied to**: All routes except `/profile`, `/logout`, and password reset routes

**Behavior**:
- If user is authenticated AND `must_change_password` = true AND requesting non-exempt route
- Then redirect to `/profile` with message: "Please update your password to continue"
- Else proceed to requested route

## Error Handling

### Validation Errors
- Status: `422 Unprocessable Entity` (for API calls)
- For web requests: Redirect back with validation errors in session
- Error format: Standard Laravel validation error format

### Authentication Errors
- Status: `401 Unauthorized`
- Error message: Standard authentication failure message