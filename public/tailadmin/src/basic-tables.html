<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Basic Tables | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="{ page: 'basicTables', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Basic Tables`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="space-y-5 sm:space-y-6">
              <div
                class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
              >
                <div class="px-5 py-4 sm:px-6 sm:py-5">
                  <h3
                    class="text-base font-medium text-gray-800 dark:text-white/90"
                  >
                    Basic Table 1
                  </h3>
                </div>
                <div
                  class="p-5 border-t border-gray-100 dark:border-gray-800 sm:p-6"
                >
                  <!-- ====== Table Six Start -->
                  <include src="./partials/table/table-06.html" />
                  <!-- ====== Table Six End -->
                </div>
                <div class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset">
                  <div class="bg-green-50 text-green-700 ring-green-600/20"></div>
                  <div class="bg-blue-50 text-blue-700 ring-blue-600/20"></div>
                  <div class="bg-red-50 text-red-700 ring-red-600/20"></div>
                  <div class="bg-gray-50 text-gray-600 ring-gray-500/10"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>

    <div class="bg-white shadow sm:rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">Statistics</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-5">
                    <div class="bg-gray-50 px-4 py-5 sm:p-6 rounded-lg">
                        <dt class="text-sm font-medium text-gray-500">Total Rows</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-gray-900"></dd>
                    </div>
                    <div class="bg-blue-50 px-4 py-5 sm:p-6 rounded-lg">
                        <dt class="text-sm font-medium text-blue-800">Valid Rows</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-blue-900"></dd>
                    </div>
                    <div class="bg-green-50 px-4 py-5 sm:p-6 rounded-lg">
                        <dt class="text-sm font-medium text-green-800">Inserted</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-green-900"></dd>
                    </div>
                    <div class="bg-yellow-50 px-4 py-5 sm:p-6 rounded-lg">
                        <dt class="text-sm font-medium text-yellow-800">Skipped</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-yellow-900"></dd>
                    </div>
                    <div class="bg-red-50 px-4 py-5 sm:p-6 rounded-lg">
                        <dt class="text-sm font-medium text-red-800">Errors</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-red-900"></dd>
                    </div>
                </div>
            </div>
        </div>

    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
